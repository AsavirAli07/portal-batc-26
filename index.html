  // Build map: GRNO (uppercase) → student
  const portalMap = new Map();
  portalData.forEach(s => portalMap.set(s.grno.toUpperCase(), s));

  // DOM
  const grInput = document.getElementById("grInput");
  const nameFilter = document.getElementById("nameFilter");
  const searchBtn = document.getElementById("searchBtn");
  const showAllBtn = document.getElementById("showAllBtn");
  const resultDiv = document.getElementById("result");
  const modal = document.getElementById("modal");
  const studentsListUl = document.getElementById("studentsList");
  const modalCloseBtn = document.getElementById("modal-close");

  // -------- Search --------
  function performSearch() {
    let raw = grInput.value.trim().toUpperCase();
    const filterName = nameFilter.value.trim().toUpperCase();

    if (!raw) {
      alert("Please enter your GR number (e.g., 261-110-1001)");
      return;
    }

    // Try exact match first
    let found = portalMap.get(raw);

    // If not found, try flexible match
    if (!found) {
      const digits = raw.replace(/[^0-9]/g, ""); // "2611101001"
      const suffix = digits.slice(-4); // "1001"

      for (const [key, student] of portalMap.entries()) {
        const keyDigits = key.replace(/[^0-9]/g, "");
        // Match by last 4 digits + optional middle segment
        if (keyDigits.endsWith(suffix)) {
          // If user provided more than just the suffix, also check middle
          if (digits.length >= 7) {
            const userMiddle = digits.slice(-7, -4); // e.g. "110"
            const keyMiddle = keyDigits.slice(-7, -4);
            if (userMiddle === keyMiddle) {
              found = student;
              break;
            }
          } else {
            found = student;
            break;
          }
        }
      }
    }

    if (!found) {
      resultDiv.style.display = "block";
      resultDiv.innerHTML = `<p style="color:#c62828; font-weight:600; background:#ffebee; padding:12px; border-radius:10px;">🔍 No student found with GR <strong>${raw}</strong>. Please check your GR number (format: 261-110-XXXX).</p>`;
      return;
    }

    // Apply optional name filter
    if (filterName && !found.name.toUpperCase().includes(filterName)) {
      resultDiv.style.display = "block";
      resultDiv.innerHTML = `<p style="color:#c62828; font-weight:600; background:#ffebee; padding:12px; border-radius:10px;">😕 GR ${found.grno} found, but the name does not match "${nameFilter.value.trim()}".</p>`;
      return;
    }

    displayStudentInfo(found);
  }

  searchBtn.addEventListener("click", performSearch);
  grInput.addEventListener("keypress", e => { if (e.key === "Enter") performSearch(); });
  nameFilter.addEventListener("keypress", e => { if (e.key === "Enter") performSearch(); });

  // -------- Display --------
  function displayStudentInfo(student) {
    resultDiv.style.display = "block";
    resultDiv.innerHTML = `
      <div class="result-header">GR No: ${student.grno} · Section ${student.section}</div>
      <div class="label-set"><span>👤 Username</span><p>${student.grno}</p></div>
      <div class="label-set"><span>🧑 Student Name</span><p>${student.name}</p></div>
      <div class="label-set"><span>🔑 Portal Password</span><p style="font-family: monospace; letter-spacing:0.5px;">${student.password}</p></div>
      <div class="label-set"><span>🔗 Portal Link</span>
        <p>
          <a href="${student.link}" target="_blank" rel="noopener">${student.link}</a><br>
          <a class="link-btn" href="${student.link}" target="_blank" rel="noopener">↗ Open Portal</a>
        </p>
      </div>
    `;
  }

  // -------- Show All --------
  showAllBtn.addEventListener("click", () => {
    const sorted = [...portalData].sort((a, b) => {
      if (a.section !== b.section) return a.section.localeCompare(b.section);
      const aNum = parseInt(a.grno.replace(/\D/g, ""), 10) || 0;
      const bNum = parseInt(b.grno.replace(/\D/g, ""), 10) || 0;
      return aNum - bNum;
    });

    studentsListUl.innerHTML = "";
    sorted.forEach(student => {
      const li = document.createElement("li");
      li.innerHTML = `
        <strong>${student.grno}</strong>
        <span style="flex:1;">${student.name}</span>
        <span style="color:#1fa463; font-weight:700; font-size:12px; background:#e6f9f0; padding:2px 8px; border-radius:20px;">Sec ${student.section}</span>
      `;
      studentsListUl.appendChild(li);
    });
    modal.classList.add("active");
  });

  modalCloseBtn.addEventListener("click", () => modal.classList.remove("active"));
  modal.addEventListener("click", e => { if (e.target === modal) modal.classList.remove("active"); });
</script>
